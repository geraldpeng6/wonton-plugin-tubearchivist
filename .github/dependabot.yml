# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
# ES 和 Redis 自己的数据卷（es-data、redis-data）：大版本换了磁盘格式，跨大版本要先迁移，
# 自动 PR 只跟小版本，大版本升级留给人手动做。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
